[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acmonitor"
version = "0.1.0"
description = "Monitor and schedule a Beko/Arçelik air conditioner through a Broadlink IR blaster"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "broadlink>=0.19",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "awsiotsdk>=1.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
acmonitor = "acmonitor.cli:main"

[tool.setuptools.packages.find]
include = ["acmonitor*"]

[tool.setuptools.package-data]
acmonitor = ["static/*"]
