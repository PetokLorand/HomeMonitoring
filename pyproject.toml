[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acmonitor"
version = "0.1.0"
description = "Monitor and schedule a Beko/Arçelik air conditioner through a Broadlink IR blaster"
readme = "README.md"
requires-python = ">=3.11"
# Pure-Python only, so it installs anywhere: Raspberry Pi (32/64-bit), Termux on Android, ...
dependencies = [
    "paho-mqtt>=2.0",
]

[project.optional-dependencies]
ir = ["broadlink>=0.19"]
dev = ["pytest>=8", "broadlink>=0.19"]

[project.scripts]
acmonitor = "acmonitor.cli:main"

[tool.setuptools.packages.find]
include = ["acmonitor*"]

[tool.setuptools.package-data]
acmonitor = ["static/*"]
